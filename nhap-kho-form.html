<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form nhập kho — PharmaFlow Learning Lab</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/explorer.css">
</head>
<body class="wiz-page">
  <header class="sfe-topbar">
    <div class="sfe-logo">Servlet Flow <span>Explorer</span></div>
    <div class="sfe-crumb">
      <a class="sfe-crumb-link" href="index.html">Learning Lab</a>
      › <strong>Nhập kho · Lưu nháp</strong>
    </div>
    <div class="sfe-topbar-right">
      <span class="sfe-chip ok">[DEMO] không ghi DB thật</span>
    </div>
  </header>

  <div class="wiz-shell">
    <nav class="wiz-stepper" id="wizStepper" aria-label="Nhóm field trên form JSP"></nav>

    <div class="wiz-head">
      <div>
        <p class="wiz-kicker" id="wizStepLabel">Field 1 / 15</p>
        <h1 id="wizTitle">Đơn đặt hàng</h1>
        <p class="wiz-sub" id="wizSub">Form JSP đầy đủ — highlight từng ô, panel phải giải thích field + layer.</p>
      </div>
      <div class="wiz-nav">
        <button type="button" class="sfe-btn" id="wizBack">Field trước</button>
        <button type="button" class="sfe-btn primary" id="wizNext">Field tiếp theo</button>
      </div>
    </div>

    <div class="wiz-grid">
      <section class="wiz-main">
        <div id="wizFormPane" class="wiz-form-host"></div>
      </section>

      <aside class="wiz-side">
        <div class="wiz-panel" id="wizFieldCard"></div>
        <div class="wiz-panel">
          <p class="wiz-card-kicker">Dữ liệu đi qua các layer</p>
          <div class="wiz-layers" id="wizLayers"></div>
          <p class="wiz-muted" id="wizLayerNote"></p>
          <div id="wizLayerDetail" class="wiz-layer-detail"></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="data/demo-catalog.js"></script>
  <script src="data/field-guide.js"></script>
  <script src="data/save-draft-trace.js"></script>
  <script src="js/wizard.js"></script>
</body>
</html>
